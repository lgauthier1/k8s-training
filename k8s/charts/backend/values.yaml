replicaCount: 3

image:
  repository: k8s-training-backend
  tag: latest
  #pullPolicy: IfNotPresent
  pullPolicy: Never # For local development

service:
  type: ClusterIP
  port: 3000

resources:
  limits:
    cpu: "0.5"
    memory: "512Mi"
  requests:
    cpu: "0.2"
    memory: "256Mi"

ingress:
  enabled: true
  host: backend.local
  path: /api